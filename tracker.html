<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2nd Quarter Project">
  <meta name="keywords" content="2nd Quarter Project">
  <meta name="author" content="Liam Joshua P. Sarmiento and Hans Christopher T. Dumlao">
  <link rel="icon" href="https://cdn.imgchest.com/files/e76eace881c8.png"/>

  <style>
    @font-face {
      font-family: "IsagiBlue";
      src: url("./fonts/Fonstars-4Bo0p.otf") format("opentype");
    }
    @font-face {
      font-family: "IsagiRed";
      src: url("./fonts/yoruka-font/Yoruka-1j9rL.ttf") format("opentype");
    }

    * { font-family: "IsagiBlue", sans-serif; }

    body {
      background-image: url("https://4kwallpapers.com/images/wallpapers/blue-lock-vs-u-20-1920x1080-20398.jpg");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
      backdrop-filter: blur(2px);
      background-size: cover;
      margin: 0;
      padding: 0;
      background-color: black;
    }

    h1, h2 {
      text-align: center; 
      text-shadow: 3px 3px 5px white;
      color: rgb(15, 4, 175);
      text-transform: uppercase;
      font-family: "IsagiBlue", sans-serif;
    }
    h2, p { margin: 10px; font-family: "IsagiRed", sans-serif; }

    ul { list-style-type: none; margin: 0; padding: 0; overflow: hidden; background-color: #3855f6; }
    ul li { float: left; }
    ul li a { display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; }
    ul li a:hover { background-color: #111111; }
    .underline-anim { position: relative; display: inline-block; cursor: pointer; text-decoration: none; }
    .underline-anim::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px;
      background-color: #ffffff; transform: scaleX(0); transform-origin: right; transition: transform 0.3s ease;
    }
    .underline-anim:hover::after { transform: scaleX(1); transform-origin: left; }

    table {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 10px;
      overflow: hidden;
      width: 70%;
      margin: 20px auto;
      font-family: "IsagiRed", sans-serif;
    }
    td, th {
      text-align: center;
      padding: 8px;
      color: black;
      background-color: #dddd;
    }

    .progress-container {
      width: 70%;
      background-color: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin: 30px auto;
      border: 2px solid #3855f6;
    }
    .progress-bar {
      height: 40px;
      width: 0%;
      background-color: #3855f6;
      text-align: center;
      line-height: 40px;
      color: white;
      transition: width 0.3s ease;
      font-family: "IsagiRed", sans-serif;
    }

    .credits { text-align: center; color: white; margin-top: 40px; }
  </style>
</head>
<body>
  <ul>
    <li><a href="./index.html" class="underline-anim">Home</a></li>
    <li><a href="./lineup.html" class="underline-anim">Lineup</a></li>
    <li><a href="./matchups.html" class="underline-anim">Matchups</a></li>
    <li><a href="./teams.html" class="underline-anim">Teams</a></li>
    <li><a href="./aces.html" class="underline-anim">Aces</a></li>
    <li><a href="./signup.html" class="underline-anim">Tracker</a></li>
    <li><a href="./references.html" class="underline-anim">Sources</a></li>
    <li style="position: absolute; right: 0;"><a href="#" class="underline-anim">Blue Lock Neo Egoist League</a></li>
  </ul>

  <header>
    <h1>Blue Lock: Neo Egoist League</h1>
    <h2>Official NEL Teams</h2>
  </header>

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar">0%</div>
  </div>

    <form action="trackerprogress.html" method="GET">
      <label for="goals">Goals</label>
      <input type="number" id="goal" name="goal" required>

      <label for="dribbles">Dribbles</label>
      <input type="number" id="dribbles"name="dribbles" required>

      <label for="shots">Shots</label>
      <input type="number" id="shots" name="shots" required>

      <label for="steps">Steps</label>
      <input type="number" id="steps" name="steps" required>  

    </form>

  <div class="credits">
    <p>Created by Hans Christopher T. Dumlao (Be11) and Liam Joshua P. Sarmiento (Be25)<br>
    All rights reserved. © 2025.</p>
  </div>



  <script>
    const checkboxes = document.querySelectorAll('.task');
    const progressBar = document.getElementById('progress-bar');
    const taskTable = document.getElementById('task-table');
    function updateProgress() {
      const total = checkboxes.length;
      const checked = document.querySelectorAll('.task:checked').length;
      const percent = Math.round((checked / total) * 100);
      progressBar.style.width = percent + '%';
      progressBar.textContent = percent + '%';


      checkboxes.forEach(box => {
        const row = box.closest('tr');
        const statusCell = row.cells[1];
        statusCell.textContent = box.checked ? "Finished" : "Pending";
      });
    }

    checkboxes.forEach(box => {
      box.addEventListener('change', updateProgress);
    });

    updateProgress();
  </script>
</body>
</html>
