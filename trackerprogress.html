<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2nd Quarter Project">
  <meta name="keywords" content="2nd Quarter Project">
  <meta name="author" content="Liam Joshua P. Sarmiento and Hans Christopher T. Dumlao">
  <link rel="icon" href="https://cdn.imgchest.com/files/e76eace881c8.png"/>

  <style>
    @font-face {
      font-family: "IsagiBlue";
      src: url("./fonts/Fonstars-4Bo0p.otf") format("opentype");
    }
    @font-face {
      font-family: "IsagiRed";
      src: url("./fonts/yoruka-font/Yoruka-1j9rL.ttf") format("opentype");
    }

    * { font-family: "IsagiBlue", sans-serif; }

    body {
      background-image: url("https://4kwallpapers.com/images/wallpapers/blue-lock-vs-u-20-1920x1080-20398.jpg");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
      backdrop-filter: blur(2px);
      background-size: cover;
      margin: 0;
      padding: 0;
      background-color: black;
    }

    h1, h2 {
      text-align: center; 
      text-shadow: 3px 3px 5px white;
      color: rgb(15, 4, 175);
      text-transform: uppercase;
      font-family: "IsagiBlue", sans-serif;
    }
    h2, p { margin: 10px; font-family: "IsagiRed", sans-serif; }

    ul { list-style-type: none; margin: 0; padding: 0; overflow: hidden; background-color: #3855f6; }
    ul li { float: left; }
    ul li a { display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; }
    ul li a:hover { background-color: #111111; }
    .underline-anim { position: relative; display: inline-block; cursor: pointer; text-decoration: none; }
    .underline-anim::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px;
      background-color: #ffffff; transform: scaleX(0); transform-origin: right; transition: transform 0.3s ease;
    }
    .underline-anim:hover::after { transform: scaleX(1); transform-origin: left; }

    table {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 10px;
      overflow: hidden;
      width: 70%;
      margin: 20px auto;
      font-family: "IsagiRed", sans-serif;
    }
    td, th {
      text-align: center;
      padding: 8px;
      color: black;
      background-color: #dddd;
    }

    .progress-container {
      width: 70%;
      background-color: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin: 30px auto;
      border: 2px solid #3855f6;
    }
    .progress-bar {
      height: 40px;
      width: 0%;
      background-color: #3855f6;
      text-align: center;
      line-height: 40px;
      color: white;
      transition: width 0.3s ease;
      font-family: "IsagiRed", sans-serif;
    }

    .credits { text-align: center; color: white; margin-top: 40px; }

    form {
      display: flex;
      flex-direction: column; 
      align-items: center;      
      justify-content: center; 
      gap: 15px;                
      margin: 50px auto;       
      width: 300px;             
      padding: 20px;
      border: 2px solid #3855f6;   
      border-radius: 8px;       
      background-color: #f9f9f9de;
        }

  </style>
  </head>
  <body>
  <ul>
    <li><a href="./index.html" class="underline-anim">Home</a></li>
    <li><a href="./lineup.html" class="underline-anim">Lineup</a></li>
    <li><a href="./matchups.html" class="underline-anim">Matchups</a></li>
    <li><a href="./teams.html" class="underline-anim">Teams</a></li>
    <li><a href="./aces.html" class="underline-anim">Aces</a></li>
    <li><a href="./signup.html" class="underline-anim">Tracker</a></li>
    <li><a href="./references.html" class="underline-anim">Sources</a></li>
    <li style="position: absolute; right: 0;"><a href="#" class="underline-anim">Blue Lock Neo Egoist League</a></li>
  </ul>

  <header>
    <h1>Blue Lock: Neo Egoist League</h1>
    <div class="progress-container">
  <div class="progress-bar" id="overallBar">0%</div>
</div>
  </header>
  <form>
    <label for="GOALS">Goals</label>
      <input type="number" id="GOALS" name="GOALS" required>

      <label for="DRIBBLES">Dribbles</label>
      <input type="number" id="DRIBBLES"name="DRIBBLES" required>

      <label for="SHOTS">Shots</label>
      <input type="number" id="SHOTS" name="SHOTS" required>

      <label for="STEPS">Steps</label>
      <input type="number" id="STEPS" name="STEPS" required>
      
      <button id="submitProgress" type="button">Submit Progress</button>
  </form>


  <script>
    const params = new URLSearchParams(window.location.search);

    const goals = params.get("goals");
    const dribbles = params.get("dribbles");
    const shots = params.get("shots");
    const steps = params.get("steps");

    document.getElementById("GOALS").value = goals;
    document.getElementById("DRIBBLES").value = dribbles;
    document.getElementById("SHOTS").value = shots;
    document.getElementById("STEPS").value = steps;

     function enforceLimit(inputId, limit) {
    const input = document.getElementById(inputId);
    input.addEventListener("input", () => {
      if (parseInt(input.value) > limit) {
        input.value = limit; // cap at the limit
      }
    });
    }

    enforceLimit("GOALS", goals);
    enforceLimit("DRIBBLES", dribbles);
    enforceLimit("SHOTS", shots);
    enforceLimit("STEPS", steps);

    function updateOverallProgress() {
    const goalVal = parseInt(document.getElementById("GOALS").value) || 0;
    const dribbleVal = parseInt(document.getElementById("DRIBBLES").value) || 0;
    const shotVal = parseInt(document.getElementById("SHOTS").value) || 0;
    const stepVal = parseInt(document.getElementById("STEPS").value) || 0;

     const totalCurrent = goalVal + dribbleVal + shotVal + stepVal;
    const totalLimit = parseInt(goals) + parseInt(dribbles) + parseInt(shots) + parseInt(steps);

    let percent = Math.min((totalCurrent / totalLimit) * 100, 100);

    const bar = document.getElementById("overallBar");
    bar.style.width = percent + "%";
    bar.textContent = Math.floor(percent) + "%";
    
    updateOverallProgress();

    const goalLimit = parseInt(params.get("goals"));
    const dribbleLimit = parseInt(params.get("dribbles"));
    const shotLimit = parseInt(params.get("shots"));
    const stepLimit = parseInt(params.get("steps"));

    function addProgress() {
  // Read current totals
  let goalTotal = parseInt(document.getElementById("GOALS").value) || 0;
  let dribbleTotal = parseInt(document.getElementById("DRIBBLES").value) || 0;
  let shotTotal = parseInt(document.getElementById("SHOTS").value) || 0;
  let stepTotal = parseInt(document.getElementById("STEPS").value) || 0;

  let goalIncrement = parseInt(document.getElementById("GOALS").dataset.increment) || 0;
  let dribbleIncrement = parseInt(document.getElementById("DRIBBLES").dataset.increment) || 0;
  let shotIncrement = parseInt(document.getElementById("SHOTS").dataset.increment) || 0;
  let stepIncrement = parseInt(document.getElementById("STEPS").dataset.increment) || 0;


  goalTotal = Math.min(goalTotal + goalIncrement, goalLimit);
  dribbleTotal = Math.min(dribbleTotal + dribbleIncrement, dribbleLimit);
  shotTotal = Math.min(shotTotal + shotIncrement, shotLimit);
  stepTotal = Math.min(stepTotal + stepIncrement, stepLimit);


  document.getElementById("GOALS").value = goalTotal;
  document.getElementById("DRIBBLES").value = dribbleTotal;
  document.getElementById("SHOTS").value = shotTotal;
  document.getElementById("STEPS").value = stepTotal;


  const totalCurrent = goalTotal + dribbleTotal + shotTotal + stepTotal;
  const totalLimit = goalLimit + dribbleLimit + shotLimit + stepLimit;
  const percent = Math.min((totalCurrent / totalLimit) * 100, 100);

  const bar = document.getElementById("overallBar");
  bar.style.width = percent + "%";
  bar.textContent = Math.floor(percent) + "%";
}

  document.getElementById("submitProgress").addEventListener("click", addProgress);
}

if (totalCurrent >= totalLimit) {
  showCompletionScreen();
}

function showCompletionScreen() {
  document.body.innerHTML = `
    <div class="navbar">
      <ul>
        <li>HOME</li>
        <li>LINEUP</li>
        <li>MATCHUPS</li>
        <li>TEAMS</li>
        <li>ACES</li>
        <li>SOURCES</li>
        <li>TRACKER</li>
        <li>BLUE LOCK NEO EGOIST LEAGUE</li>
      </ul>
    </div>

    <h1>GOALS REACHED!</h1>

    <div class="progress-container">
      <div class="progress-bar" style="width:100%">100%</div>
    </div>

    <div class="stats">
      <p>GOALS: ${goalLimit}</p>
      <p>DRIBBLES: ${dribbleLimit}</p>
      <p>SHOTS: ${shotLimit}</p>
      <p>STEPS: ${stepLimit}</p>
    </div>

    <button id="resetButton">RESET</button>

    <footer>COPYRIGHT</footer>
  `;

  document.getElementById("resetButton").addEventListener("click", () => {
    window.location.href = "tracker.html";
  });
}

  </script>

</body>
